name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality
    needs: native-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run code quality checks
        run: pnpm check

  native-rust:
    name: Native Rust contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
      - name: Verify native quality and locked builds
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo +1.88.0 build --locked
          cargo build --locked
          cargo build --locked --example storage-probe
      - name: Set up Node.js test tooling
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install shell test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native process and shared parser contracts
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/debug/tmt","args":[]}'
          TMT_TEST_STORAGE_PROBE: '{"executable":"${{ github.workspace }}/rust/target/debug/examples/storage-probe","args":[]}'
        run: |
          pnpm test:native

  unit-tests:
    name: Unit tests
    needs: native-runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install shell and linkage test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh binutils
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the native executable for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64-unknown-linux-musl
          path: rust/target/debug
      - name: Run retained developer tooling tests
        # The deleted TypeScript source coverage denominator is not Rust coverage.
        # Rust unit/process contracts and Docker remain independent required gates.
        run: |
          chmod +x rust/target/debug/tmt
          pnpm test:run

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Docker end-to-end tests
        run: pnpm test:e2e

  native-runtime-build:
    name: Build native runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      # Runner allocation for the four targets owned by dist-workspace.toml.
      # These are raw PR executables, not cargo-dist release archives.
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache locked native compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: runtime-${{ matrix.target }}-rust1.97-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build the reviewed native runtime
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --locked --release --target '${{ matrix.target }}' -p tmt-cli
      - name: Record the Cargo-owned version
        working-directory: rust
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tmt-cli"))' > target/${{ matrix.target }}/release/version.txt
      - name: Share the same executable with matching runtime environments
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/tmt
            rust/target/${{ matrix.target }}/release/version.txt
          if-no-files-found: error
          retention-days: 1

  packed-native-install:
    # Preserve required historical check names while replacing the retired npm
    # product. Each row now executes native linkage/skill/SQLite runtime proof.
    name: Packed install (${{ matrix.label }})
    needs: native-runtime-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            container: false
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            container: false
          - label: Linux glibc x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: false
          - label: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: false
          - label: Linux musl x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: true
          - label: Linux musl arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download the matching native executable
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime
      - name: Restore executable permission
        run: chmod +x runtime/tmt
      - name: Install linkage inspection tool
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils
      - name: Verify native runtime on matching host
        if: ${{ !matrix.container }}
        run: |
          node scripts/verify-native-runtime.mjs \
            --executable "$GITHUB_WORKSPACE/runtime/tmt" \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill skills/tmux-team/SKILL.md
      - name: Build the verification-only Alpine environment
        if: ${{ matrix.container }}
        run: docker build -f test/native/runtime.Dockerfile -t tmt-runtime-proof .
      - name: Verify the same static executable in matching native Alpine
        if: ${{ matrix.container }}
        run: |
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/runtime:/runtime:ro" \
            tmt-runtime-proof \
            --executable /runtime/tmt \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill /verification/skills/tmux-team/SKILL.md

  native-install-gate:
    name: Native package matrix
    if: ${{ always() }}
    needs: packed-native-install
    runs-on: ubuntu-latest
    steps:
      - name: Require every native target
        env:
          MATRIX_RESULT: ${{ needs.packed-native-install.result }}
        run: test "$MATRIX_RESULT" = success
