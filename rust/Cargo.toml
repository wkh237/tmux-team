[workspace]
members = ["crates/tmt-core", "crates/tmt-adapters", "crates/tmt-cli"]
resolver = "3"

[workspace.package]
version = "5.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
tmt-core = { path = "crates/tmt-core" }
tmt-adapters = { path = "crates/tmt-adapters" }
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
clap_complete = { version = "=4.6.9", default-features = false }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
subprocess = "=1.2.1"
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process"] }
uuid = { version = "=1.26.0", default-features = false, features = ["std"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.3.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
